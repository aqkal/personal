name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate content
        run: npm run validate:content

      - name: Lint
        run: npm run lint

      - name: Verify contact protections
        run: npm run test:contact

      - name: Verify world and arcade logic
        run: npm run test:world

      - name: Verify physics and travel
        run: npm run test:physics

      - name: Verify optimized collision, transport and route work
        run: npm run test:frame-cpu

      - name: Verify world startup lifecycle
        run: npm run test:startup

      - name: Verify interpolated transport presentation
        run: npm run test:travel-presentation

      - name: Verify scooter wheel rendering and recovery
        run: npm run test:scooter-render

      - name: Verify drift physics and skid trails
        run: npm run test:drift

      - name: Verify building and vehicle clearance
        run: npm run test:buildings

      - name: Verify shoreline barriers and access
        run: npm run test:shore

      - name: Verify moving-camera framing
        run: npm run test:camera-follow

      - name: Validate authored game assets
        run: npm run validate:assets

      - name: Verify compressed model loading
        run: npm run test:gltf

      - name: Typecheck
        run: npm run typecheck

      - name: Build (Vercel target)
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://example.com

      - name: Verify production pages and headers
        run: npm run test:http

      - name: Build (Cloudflare Workers target)
        run: npm run build:cf
        env:
          NEXT_PUBLIC_SITE_URL: https://example.com

      - name: Verify local Cloudflare Worker
        run: npm run test:http -- --cloudflare

      - name: Dependency audit
        run: npm audit --audit-level=high

      # To auto-deploy to Cloudflare on pushes to main, add the repo secrets
      # CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID, then uncomment:
      # - name: Deploy to Cloudflare
      #   if: github.ref == 'refs/heads/main'
      #   run: npx wrangler deploy
      #   env:
      #     CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      #     CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
